name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sensitive-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan checked-out index for sensitive data
        run: python3 scripts/check_sensitive_data.py --index --fail-on-findings
      - name: Scan reachable Git history for sensitive data
        run: python3 scripts/check_sensitive_data.py --history --fail-on-findings
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_repo.py
  concurrency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Repeat cold starts and ledger replay with 24 hook processes
        run: |
          python3 - <<'PY'
          import os
          import sys
          import unittest
          # Exercise contention on a busy host without starting unrelated load.
          os.sched_setaffinity(0, {min(os.sched_getaffinity(0))})
          sys.path.insert(0, "tests")
          from test_publisher_concurrency import PublisherConcurrencyTest
          names = (
              "test_24_process_cold_start_same_pin_and_distinct_jobs",
              "test_24_process_governor_replay_accounting_isolation_and_halt",
          )
          suite = unittest.TestSuite(
              PublisherConcurrencyTest(name) for _ in range(8) for name in names
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          PY
